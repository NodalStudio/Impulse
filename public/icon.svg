<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2d5c"/>
      <stop offset="100%" stop-color="#031225"/>
    </linearGradient>
    <linearGradient id="g" x1="10" y1="6" x2="22" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4a456"/>
      <stop offset="100%" stop-color="#bf8a3d"/>
    </linearGradient>
  </defs>
  <!-- Navy rounded-square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle gold border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" fill="none" stroke="#bf8a3d" stroke-width="0.5" opacity="0.25"/>
  <!-- Triangle inner glow -->
  <polygon points="16,6.5 27,25.5 5,25.5" fill="#bf8a3d" opacity="0.1"/>
  <!-- Triangle outline — gold gradient stroke -->
  <polygon points="16,6.5 27,25.5 5,25.5" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
