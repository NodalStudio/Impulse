# Workflow for building and deploying Next.js static site to GitHub Pages
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Version is read from packageManager in package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_IMPULSE_CONTACT_API: ${{ vars.NEXT_PUBLIC_IMPULSE_CONTACT_API }}
        run: pnpm build

      # Compress/resize images in the built output before deploy. Catches
      # CMS-uploaded photos (out/images/uploads) automatically on every deploy,
      # without touching source files or component code (same filenames/formats).
      # ImageMagick is preinstalled on GitHub-hosted ubuntu runners.
      - name: Optimize images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          find out/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) \
            -exec mogrify -resize '1600x1600>' -strip -interlace Plane -quality 82 {} +
          find out/images -type f -iname '*.png' \
            -exec mogrify -resize '1600x1600>' -strip {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
